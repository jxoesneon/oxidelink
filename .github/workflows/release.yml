name: Release OxideLink

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      OXIDELINK_PFX_PASSWORD: ${{ secrets.OXIDELINK_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app with updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Code-sign artifacts
        if: ${{ env.OXIDELINK_PFX_PASSWORD != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = 'src-tauri/target/release/bundle'
          $artifacts = @()
          $artifacts += Get-ChildItem -Path $bundleRoot -Include '*.exe','*.msi' -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $artifacts) {
            & scripts/sign-tauri.ps1 -Path $file.FullName
          }

      - name: Read version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate latest.json updater manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPO: ${{ github.repository }}
        run: |
          # Read the signature file produced by tauri build (NSIS .exe.sig)
          SIG_FILE="src-tauri/target/release/bundle/nsis/OxideLink_${VERSION}_x64-setup.exe.sig"
          SIGNATURE=""
          if [ -f "$SIG_FILE" ]; then
            SIGNATURE=$(cat "$SIG_FILE")
          fi

          # The updater downloads the NSIS setup exe from the GitHub release.
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/v${VERSION}/OxideLink_${VERSION}_x64-setup.exe"

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "OxideLink v${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "${DOWNLOAD_URL}"
              }
            }
          }
          EOF

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload release bundles
        uses: actions/upload-artifact@v7
        with:
          name: oxideLink-windows-bundles
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: OxideLink ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            latest.json
