[package]
name = "oxidelink"
version = "0.2.0"
edition = "2021"
description = "OxideLink — Native Windows driver and manager for the Nintendo Switch Pro Controller"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
hidapi = "2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Services",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_EventLog",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Devices_Bluetooth",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
parking_lot = "0.12"
dirs-next = "2.0"
crc32fast = "1.5"
semver = "1"
sentry = { version = "0.36", default-features = false, features = ["panic", "ureq", "rustls", "backtrace"] }
ureq = { version = "2.10", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = []
# Integration tests require real hardware (Pro Controller, Bluetooth, HidHide driver).
# Run with: cargo test --features integration --test integration
integration = []

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.11.0"
